app = "tg-notion-obsidian"
primary_region = "ams"  # آمستردام (نزدیک‌ترین منطقه با قیمت مناسب)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # برای صرفه‌جویی در هزینه

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "obsidian_data"
  destination = "/data/vault"
